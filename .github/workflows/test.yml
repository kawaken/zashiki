name: Test

# 個人用フォーク(kawaken/zashiki)向けの最小構成。
# 本家(ghostty-org/ghostty)のtest.ymlはNamespace Cloud専用ランナーと
# `if: github.repository == 'ghostty-org/ghostty'`ガードに全面依存しており
# フォークでは何も動かないため、標準のGitHub Hostedランナーで動く
# 最小限のTest/Lintとして書き直したもの。
#
# 対象はmacOS + Zigコア + Swift(macOSアプリ)のみ。Linux/Windows/GTK/Nix等
# 本家のマルチプラットフォーム対応は個人フォークでは扱わない。
#
# pushはmainブランチのみを対象にする。feature branchへのpushは
# pull_requestイベント経由でのみ実行し、同じコミットに対して
# push/pull_requestの両方が発火して二重実行になるのを避ける。
#
# plan/配下(設計ドキュメントのみ)・docs/history/配下(完了済みplanの
# アーカイブ)・.github/workflows配下(CI設定自体)・
# .claude/配下(Claude Codeの設定)・README.md/AGENTS.md/LICENSE・
# typos.toml・Makefileは
# ビルド・テスト対象のコードに影響しないため、paths-ignoreでCIをスキップ
# する。それ以外のファイルが1つでも変更に含まれていれば通常通り実行される。
# (example/・po/・dist/・pkg/はドキュメントに見えても実ビルド入力を含む
# ため対象外。詳細はビルドスクリプト側の依存を確認すること)
# 注意: この仕組み上、test.yml自身の変更もスキップ対象になる
# (このワークフローが変更後の自分自身の内容で実行されることはない)。
# 記述ミスはActionsの構文チェックでは検出されるが、ロジックの誤りは
# 次にコード変更を伴うpush/PRが来るまで気付けない可能性がある。

on:
  push:
    branches:
      - main
    paths-ignore:
      - "plan/**"
      - "docs/history/**"
      - ".github/workflows/**"
      - ".claude/**"
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "typos.toml"
      - "Makefile"
  pull_request:
    paths-ignore:
      - "plan/**"
      - "docs/history/**"
      - ".github/workflows/**"
      - ".claude/**"
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "typos.toml"
      - "Makefile"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: zig build test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode Select
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26.x not found on this runner, falling back to the default Xcode"
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Xcode Version
        run: xcodebuild -version

      - name: Cache Xcode DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-derived-data-debug-${{ runner.arch }}-${{ hashFiles('macos/**/*.swift', 'macos/Ghostty.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-derived-data-debug-${{ runner.arch }}-

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: zig build test
        # -Demit-macos-app=falseだけではxcodebuild testが暗黙のtest_step依存
        # (build.zigのemit_xcframeworkデフォルト値経由)から外れないため、
        # -Demit-xcframework=falseも明示する。これによりmacOSアプリの
        # xcodebuild test(実測で全体の1分半ほど、かつローカル環境でも
        # 「複数destinationにマッチ」でfailed command扱いになっており
        # 実効性が疑わしい)をスキップし、Zigコアのテストのみ実行する。
        # macOSアプリを含むフルテストはリリース時(release.yml)に回す想定。
        run: zig build test -Demit-macos-app=false -Demit-xcframework=false

  build:
    name: zig build (macOS app)
    runs-on: macos-15
    timeout-minutes: 30
    # macOSランナーは無料枠消費が重いので、.appの実ビルドはリリース
    # 準備の時だけ手動実行(workflow_dispatch)する。push/PRでは走らせない。
    # リリース戦略自体は別途検討する。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode Select
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26.x not found on this runner, falling back to the default Xcode"
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Xcode Version
        run: xcodebuild -version

      - name: Cache Xcode DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-derived-data-release-${{ runner.arch }}-${{ hashFiles('macos/**/*.swift', 'macos/Ghostty.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-derived-data-release-${{ runner.arch }}-

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Build Zashiki.app
        run: zig build -Doptimize=ReleaseFast -Dxcframework-target=native

  lint:
    name: Lint (zig fmt / swiftlint / prettier)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: zig fmt
        run: zig fmt --check .

      - name: Install swiftlint
        run: brew install swiftlint

      - name: swiftlint
        run: swiftlint lint --strict

      - name: prettier
        run: npx --yes prettier --check .
