name: Test

# 個人用フォーク(kawaken/zashiki)向けの最小構成。
# 本家(ghostty-org/ghostty)のtest.ymlはNamespace Cloud専用ランナーと
# `if: github.repository == 'ghostty-org/ghostty'`ガードに全面依存しており
# フォークでは何も動かないため、標準のGitHub Hostedランナーで動く
# 最小限のTest/Lintとして書き直したもの。
#
# 対象はmacOS + Zigコア + Swift(macOSアプリ)のみ。Linux/Windows/GTK/Nix等
# 本家のマルチプラットフォーム対応は個人フォークでは扱わない。
#
# pushはmainブランチのみを対象にする。feature branchへのpushは
# pull_requestイベント経由でのみ実行し、同じコミットに対して
# push/pull_requestの両方が発火して二重実行になるのを避ける。
#
# plan/配下(設計ドキュメントのみ)・docs/history/配下(完了済みplanの
# アーカイブ)・.claude/配下(Claude Codeの設定)・README.md/AGENTS.md/
# CHANGELOG.md/LICENSE・typos.toml・Makefileだけの変更では、差分判定jobが
# test/lintをスキップする。それ以外のファイルが1つでも変更に含まれていれば
# 通常通り実行される。
# (example/・po/・dist/・pkg/はドキュメントに見えても実ビルド入力を含む
# ため対象外。詳細はビルドスクリプト側の依存を確認すること)
# workflow自身を含む.github/workflows/配下の変更はCI設定の変更を検証するため、
# 常に通常のtest/lintを実行する。

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r file; do
            case "$file" in
              plan/*|docs/history/*|.claude/*|README.md|AGENTS.md|CHANGELOG.md|LICENSE|typos.toml|Makefile)
                ;;
              *)
                code=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: just test-fast
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        run: brew install just

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26.x not found on this runner, falling back to the default Xcode"
            XCODE_PATH=$(xcode-select -p)
          else
            XCODE_PATH="$XCODE_PATH/Contents/Developer"
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH" >> "$GITHUB_ENV"

      - name: Xcode Version
        run: just xcode-version

      - name: Cache Xcode DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-derived-data-debug-${{ runner.arch }}-${{ hashFiles('macos/**/*.swift', 'macos/Zashiki.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-derived-data-debug-${{ runner.arch }}-

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: just test-fast
        # -Dmacos-app-xctest=falseにより、Zigコアのテストに加えてmacOSアプリの
        # Swiftコンパイル(xcodebuild build)は実行しつつ、XCTest
        # (xcodebuild test)はスキップする。xcodebuild testは実行時間や
        # macOSランナーのコストが大きいため、フルテストはリリース時
        # (release.yml)に回す想定。Swiftのコンパイルエラーはこのジョブで
        # 検出できる。
        run: just test-fast

  build:
    name: zig build (macOS app)
    runs-on: macos-15
    timeout-minutes: 30
    # macOSランナーは無料枠消費が重いので、.appの実ビルドは通常走らせない。
    # 例外はリリース準備の手動確認(workflow_dispatch)と、PRに
    # `needs-verification`ラベルが付いている場合。後者は実機での動作
    # 確認(見た目・操作感など、CIだけでは確認できない変更)が必要なPRを、
    # リリースを切らずに手元で試せるようにするためのもの。ビルド成果物
    # はworkflow artifactとしてアップロードする。
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'needs-verification')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode Select
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26.x not found on this runner, falling back to the default Xcode"
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Xcode Version
        run: xcodebuild -version

      - name: Cache Xcode DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-derived-data-release-${{ runner.arch }}-${{ hashFiles('macos/**/*.swift', 'macos/Zashiki.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-derived-data-release-${{ runner.arch }}-

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Build Zashiki.app
        run: zig build -Doptimize=ReleaseFast -Dxcframework-target=native

      - name: Zip Zashiki.app
        if: github.event_name == 'pull_request'
        run: |
          cd zig-out
          zip -9 -r --symlinks "../Zashiki-pr${{ github.event.pull_request.number }}.zip" Zashiki.app

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Zashiki-pr${{ github.event.pull_request.number }}
          path: Zashiki-pr${{ github.event.pull_request.number }}.zip
          retention-days: 14

  lint:
    name: just lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        run: brew install just

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Install swiftlint
        run: brew install swiftlint

      - name: just lint
        run: just lint
