name: Claude Code Label Trigger

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # publicリポジトリのため、自分がラベルを付けた場合のみ起動する。
    # `allowed_non_write_users`は使わない(actionの公式ドキュメントでRISKYと
    # 明記されている)。
    if: github.event.label.name == 'claude' && github.actor == 'kawaken'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `prompt`を指定するとissuesイベントは無条件でagentモードになり、
      # Issue本文などのGitHubコンテキストが自動注入されなくなる(実機検証で
      # 確認済み)。tagモードを維持してコンテキストを自動的に渡すため、
      # `prompt`は指定しない。CI実行時のルール(CI-NOTES.md)は、CLAUDE.mdを
      # 一時的に差し替えることでClaude Code標準の自動読み込みに乗せる。
      # `CLAUDE.md`は`AGENTS.md`へのシンボリックリンクのため、実体である
      # `AGENTS.md`の方を差し替える。
      - name: Prepare CI-specific CLAUDE.md
        run: |
          git update-index --skip-worktree AGENTS.md
          { echo ""; cat .github/claude/CI-NOTES.md; } >> AGENTS.md

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"

      - name: Restore CLAUDE.md
        if: always()
        run: |
          git update-index --no-skip-worktree AGENTS.md
          git checkout -- AGENTS.md

      # claude-code-actionは仕様上PRを自動作成せず、ブランチへのpushと
      # PR送信ページへのリンク提供までしか行わない(公式FAQで明記)。
      # 「claudeラベルを付けるとPRができる」というUXを実現するため、
      # ここでワークフロー側がgh pr createを実行する。
      #
      # GH_TOKENには`github.token`(標準のGITHUB_TOKEN)を使わない。
      # GITHUB_TOKENで作成したPRは、そのイベント自体が新しいワークフロー
      # 実行(test.yml等)をトリガーしないというGitHub Actions既知の制約が
      # あるため。actionの`github_token` output(Claude App token)も試したが、
      # action内部で最後にrevoke済みで401エラーになった。このリポジトリ
      # 限定・Contents+Pull requests write権限のfine-grained PATを
      # `GH_PAT_PR_CREATE`として発行し、それを使う。
      - name: Create Pull Request
        id: create-pr
        if: always() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PR_CREATE }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          existing_pr=$(gh pr view "$BRANCH_NAME" --json number -q .number 2>/dev/null || true)
          if [ -n "$existing_pr" ]; then
            echo "PRは既に存在します: #$existing_pr"
            pr_number="$existing_pr"
          else
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "$ISSUE_TITLE" \
              --body "Related to #${ISSUE_NUMBER}" \
              || echo "PR作成に失敗しました(変更なしの可能性があります)"
            pr_number=$(gh pr view "$BRANCH_NAME" --json number -q .number 2>/dev/null || true)
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: always() && steps.claude.outputs.execution_file != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record usage to BigQuery
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          pip install --quiet google-cloud-bigquery
          python3 .github/scripts/record_usage.py \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --run-id "${{ github.run_id }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --pr-number "${{ steps.create-pr.outputs.pr_number }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
