name: Release

# 個人用フォーク(kawaken/zashiki)向けの最小リリース構成。
# 本家のrelease-tag.yml/publish-tag.ymlはApple証明書・notarization・
# Sparkle自動更新・Cloudflare R2など15個のsecretsに依存し、しかも
# GitHub Releaseへの添付すら行わない設計だったため、
# 「タグを打ったらad-hoc署名のZashiki.appをzipにしてGitHub Releaseに
# 添付する」だけの最小構成に全面書き換えたもの。
#
# Sparkleの署名付きappcastはGitHub Releaseへ公開する。ただしApple Developer
# Program登録・notarization前は更新の自動チェックを有効化しない。
#
# test.yml(push/PR)はCI時間短縮のため-Dmacos-app-xctest=falseで
# xcodebuild test(macOSアプリ側のXCTest)を除外し、Swiftコンパイルの検証
# (xcodebuild build)のみ行っている。XCTestを含む品質保証はここ
# (このworkflowのfull test)で担保する。
#
# このworkflowは手動起動を唯一のリリース入口とする。tagが既存ならその
# commitを使い、存在しないtagならmainのHEADにローカルtagを作ってから
# test/buildし、成功後にPATでtagをpushする。GITHUB_TOKENのイベント連鎖に
# 依存せず、タグ作成からGitHub Release公開までを同じ実行で完了させる。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "既存タグ名。存在しなければmainにこの名前で新規作成 (例: v0.1.0-rc.1)"
        required: false
      version:
        description: "タグ未指定時の新規リリースバージョン (例: 0.1.0)"
        required: false
      rc:
        description: "タグ未指定時のRC番号。正式リリースなら空欄 (例: 1)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # フルテスト(xcodebuild test含む)+ビルドで実測20分超のため余裕を持たせる
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select release target
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RC: ${{ inputs.rc }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            if [[ -z "$INPUT_VERSION" ]]; then
              echo "::error::tagまたはversionのいずれかを指定してください。"
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::versionはX.Y.Z形式で指定してください (入力値: $INPUT_VERSION)"
              exit 1
            fi
            if [[ -n "$INPUT_RC" ]] && ! [[ "$INPUT_RC" =~ ^[0-9]+$ ]]; then
              echo "::error::rcは正の整数で指定してください (入力値: $INPUT_RC)"
              exit 1
            fi
            if [[ -n "$INPUT_RC" ]]; then
              TAG="v${INPUT_VERSION}-rc.${INPUT_RC}"
            else
              TAG="v${INPUT_VERSION}"
            fi
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tagはvX.Y.ZまたはvX.Y.Z-rc.N形式で指定してください (入力値: $TAG)"
            exit 1
          fi

          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG^{commit}")"
            git checkout --detach "$TAG_SHA"
            if [[ "$(git rev-parse HEAD)" != "$TAG_SHA" ]]; then
              echo "::error::タグのcommitをcheckoutできませんでした。"
              exit 1
            fi
            TAG_SOURCE="existing"
            echo "既存タグを利用します: $TAG ($TAG_SHA)"
          else
            git checkout --detach origin/main
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "::error::リモートにはないローカルタグが既に存在します: $TAG"
              exit 1
            fi
            git tag -a "$TAG" -m "$TAG"
            TAG_SOURCE="new"
            echo "mainのcommit $(git rev-parse HEAD) に新規タグを作成します: $TAG"
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_source=$TAG_SOURCE" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          # RCs use the Unreleased section. Stable releases use the matching
          # version section, which should be finalized before the stable tag.
          if [[ "$RELEASE_VERSION" == *-rc* ]]; then
            changelog_heading="Unreleased"
          else
            changelog_heading="${RELEASE_VERSION%%-rc*}"
          fi
          awk -v version="$changelog_heading" '
            $0 ~ "^## " version "([[:space:]]|$)" {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for $changelog_heading"
            exit 1
          fi

      - name: Xcode Select
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26.x not found on this runner, falling back to the default Xcode"
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Xcode Version
        run: xcodebuild -version

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@272b55e6c4fcef353f6d923050ff32f018636378 # Node.js 24 support
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: zig build test
        # macOSアプリのxcodebuild testも含むフルテスト。フラグなしで
        # emit_xcframeworkのデフォルト値(true)に任せる。失敗したら
        # ここでリリースを止める。
        run: zig build test

      - name: Build Zashiki.app
        run: zig build -Doptimize=ReleaseFast -Dxcframework-target=native

      - name: Push new tag
        if: steps.target.outputs.tag_source == 'new'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PR_CREATE }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GH_PAT_PR_CREATE repository secret is required to push a new release tag."
            exit 1
          fi
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Zip Zashiki.app
        run: |
          cd zig-out
          zip -9 -r --symlinks "../Zashiki-${RELEASE_TAG}-macos.zip" Zashiki.app

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY repository secret is required to sign appcast.xml."
            exit 1
          fi

          archives_dir="$RUNNER_TEMP/zashiki-sparkle-archives"
          mkdir -p "$archives_dir"
          cp "Zashiki-${RELEASE_TAG}-macos.zip" "$archives_dir/"

          # Preserve entries from the previous stable feed. On the first
          # release this URL is a 404, which is expected.
          curl --fail --location --retry 3 \
            --output "$archives_dir/appcast.xml" \
            "https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" \
            || rm -f "$archives_dir/appcast.xml"

          sparkle_project=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/checkouts/Sparkle/Sparkle.xcodeproj' \
            -print -quit)
          if [ -z "$sparkle_project" ]; then
            echo "::error::Could not locate the Sparkle source package after the build."
            exit 1
          fi

          sparkle_derived_data="$RUNNER_TEMP/zashiki-sparkle-tools"
          xcodebuild -project "$sparkle_project" -scheme generate_appcast \
            -configuration Release -derivedDataPath "$sparkle_derived_data" build

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$sparkle_derived_data/Build/Products/Release/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}" \
            --maximum-versions 0 \
            --maximum-deltas 0 \
            -o "$archives_dir/appcast.xml" \
            "$archives_dir"
          cp "$archives_dir/appcast.xml" appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.target.outputs.release_tag }}
          name: Zashiki ${{ steps.target.outputs.release_tag }}
          files: |
            Zashiki-*-macos.zip
            appcast.xml
          generate_release_notes: false
          body_path: release-notes.md
          prerelease: ${{ contains(steps.target.outputs.release_tag, '-rc') }}
