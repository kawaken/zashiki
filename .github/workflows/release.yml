name: Release

# 個人用フォーク(kawaken/zashiki)向けの最小リリース構成。
# 本家のrelease-tag.yml/publish-tag.ymlはApple証明書・notarization・
# Sparkle自動更新・Cloudflare R2など15個のsecretsに依存し、しかも
# GitHub Releaseへの添付すら行わない設計だったため、
# 「タグを打ったらad-hoc署名のZashiki.appをzipにしてGitHub Releaseに
# 添付する」だけの最小構成に全面書き換えたもの。
#
# Sparkleの署名付きappcastとrelease-manifestはGitHub Releaseへ公開する。
# ただしApple Developer Program登録・notarization前は更新の自動チェックを
# 有効化しない。
#
# test.yml(push/PR)はCI時間短縮のため-Dmacos-app-xctest=falseで
# xcodebuild test(macOSアプリ側のXCTest)を除外し、Swiftコンパイルの検証
# (xcodebuild build)のみ行っている。XCTestを含む品質保証はここ
# (このworkflowのfull test)で担保する。
#
# このworkflowはstable正式版の手動起動を唯一のリリース入口とする。tagが
# 既存ならそのcommitを使い、存在しないtagならmainのHEADにローカルtagを
# 作ってからtest/buildし、成功後にPATでtagをpushする。GITHUB_TOKENの
# イベント連鎖に依存せず、タグ作成からGitHub Release公開までを同じ実行で
# 完了させる。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: 0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # フルテスト(xcodebuild test含む)+ビルドで実測20分超のため余裕を持たせる
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select release target
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$INPUT_VERSION" ]]; then
            echo "::error::versionを指定してください。"
            exit 1
          fi
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionはX.Y.Z形式で指定してください (入力値: $INPUT_VERSION)"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$INPUT_VERSION"
          for component in "$major" "$minor" "$patch"; do
            if (( 10#$component > 999 )); then
              echo "::error::versionの各要素は999以下にしてください (入力値: $INPUT_VERSION)"
              exit 1
            fi
          done

          TAG="v${INPUT_VERSION}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::stableのtagはvX.Y.Z形式で指定してください (入力値: $TAG)"
            exit 1
          fi

          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG^{commit}")"
            git checkout --detach "$TAG_SHA"
            if [[ "$(git rev-parse HEAD)" != "$TAG_SHA" ]]; then
              echo "::error::タグのcommitをcheckoutできませんでした。"
              exit 1
            fi
            TAG_SOURCE="existing"
            echo "既存タグを利用します: $TAG ($TAG_SHA)"
          else
            git checkout --detach origin/main
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "::error::リモートにはないローカルタグが既に存在します: $TAG"
              exit 1
            fi
            git tag -a "$TAG" -m "$TAG"
            TAG_SOURCE="new"
            echo "mainのcommit $(git rev-parse HEAD) に新規タグを作成します: $TAG"
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_source=$TAG_SOURCE" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # Stable releases use the changes accumulated under Unreleased.
          # The stable release step archives this section after the GitHub
          # Release is created.
          changelog_heading="Unreleased"
          awk -v version="$changelog_heading" '
            $0 ~ "^## " version "([[:space:]]|$)" {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for $changelog_heading"
            exit 1
          fi

      - name: Xcode Select
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26.x not found on this runner, falling back to the default Xcode"
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Xcode Version
        run: xcodebuild -version

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@272b55e6c4fcef353f6d923050ff32f018636378 # Node.js 24 support
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: zig build test
        # macOSアプリのxcodebuild testも含むフルテスト。フラグなしで
        # emit_xcframeworkのデフォルト値(true)に任せる。失敗したら
        # ここでリリースを止める。
        run: zig build test

      - name: Build Zashiki.app
        run: zig build -Doptimize=ReleaseFast -Dxcframework-target=native

      - name: Push new tag
        if: steps.target.outputs.tag_source == 'new'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PR_CREATE }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GH_PAT_PR_CREATE repository secret is required to push a new release tag."
            exit 1
          fi
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Zip Zashiki.app
        run: |
          set -euo pipefail
          cd zig-out
          zip -9 -r --symlinks "../Zashiki-${RELEASE_TAG}-macos.zip" Zashiki.app

      - name: Inspect release artifacts
        id: artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          app_path="zig-out/Zashiki.app"
          info_plist="$app_path/Contents/Info.plist"
          archive_name="Zashiki-${RELEASE_TAG}-macos.zip"

          if [[ ! -f "$info_plist" || ! -f "$archive_name" ]]; then
            echo "::error::Release artifactが見つかりません。"
            exit 1
          fi

          version="$(plutil -extract CFBundleShortVersionString raw -o - "$info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$info_plist")"
          minimum_macos_version="$(plutil -extract LSMinimumSystemVersion raw -o - "$info_plist")"

          IFS=. read -r major minor patch <<< "$INPUT_VERSION"
          expected_build_version=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if [[ "$version" != "$INPUT_VERSION" ]]; then
            echo "::error::CFBundleShortVersionStringが入力versionと一致しません: $version"
            exit 1
          fi
          if [[ "$build_version" != "$expected_build_version" ]]; then
            echo "::error::CFBundleVersionが期待値と一致しません: $build_version (期待値: $expected_build_version)"
            exit 1
          fi
          if [[ -z "$minimum_macos_version" ]]; then
            echo "::error::LSMinimumSystemVersionが空です。"
            exit 1
          fi

          unzip -tq "$archive_name"
          archive_size="$(stat -f '%z' "$archive_name")"
          archive_sha256="$(shasum -a 256 "$archive_name" | awk '{print $1}')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "minimum_macos_version=$minimum_macos_version" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_size=$archive_size" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ARCHIVE_NAME: ${{ steps.artifact.outputs.archive_name }}
          ARCHIVE_SIZE: ${{ steps.artifact.outputs.archive_size }}
          VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_VERSION: ${{ steps.artifact.outputs.build_version }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY repository secret is required to sign appcast.xml."
            exit 1
          fi

          archives_dir="$RUNNER_TEMP/zashiki-sparkle-archives"
          mkdir -p "$archives_dir"
          cp "$ARCHIVE_NAME" "$archives_dir/"

          # Preserve entries from the previous stable feed. Only a genuine
          # 404 means that the history does not exist yet. Network, auth, and
          # server failures must stop the release instead of deleting history.
          history_url="https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml"
          history_path="$archives_dir/appcast.xml"
          set +e
          history_status="$(curl --silent --show-error --location --retry 3 \
            --output "$archives_dir/appcast.xml" \
            --write-out '%{http_code}' \
            "$history_url")"
          history_curl_status=$?
          set -e

          if (( history_curl_status != 0 )); then
            rm -f "$history_path"
            echo "::error::過去のappcast取得に失敗しました (curl exit: $history_curl_status)。初回扱いにはしません。"
            exit 1
          fi

          case "$history_status" in
            2[0-9][0-9])
              if [[ ! -s "$history_path" ]]; then
                echo "::error::過去のappcastが空です。初回扱いにはしません。"
                exit 1
              fi
              history_available=true
              ;;
            404)
              rm -f "$history_path"
              history_available=false
              echo "過去のappcastはまだありません。初回として生成します。"
              ;;
            *)
              rm -f "$history_path"
              echo "::error::過去のappcast取得がHTTP $history_statusで失敗しました。初回扱いにはしません。"
              exit 1
              ;;
          esac

          old_versions=""
          if [[ "$history_available" == true ]]; then
            old_versions="$(grep -oE '<sparkle:version>[^<]+' "$history_path" | sed 's/<sparkle:version>//')"
          fi

          sparkle_project=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/checkouts/Sparkle/Sparkle.xcodeproj' \
            -print -quit)
          if [ -z "$sparkle_project" ]; then
            echo "::error::Could not locate the Sparkle source package after the build."
            exit 1
          fi

          sparkle_derived_data="$RUNNER_TEMP/zashiki-sparkle-tools"
          xcodebuild -project "$sparkle_project" -scheme generate_appcast \
            -configuration Release -derivedDataPath "$sparkle_derived_data" build

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$sparkle_derived_data/Build/Products/Release/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}" \
            --maximum-versions 0 \
            --maximum-deltas 0 \
            -o "$archives_dir/appcast.xml" \
            "$archives_dir"
          cp "$archives_dir/appcast.xml" appcast.xml

          for old_version in $old_versions; do
            if ! grep -Fq "<sparkle:version>$old_version</sparkle:version>" appcast.xml; then
              echo "::error::既存の正式版項目がappcastから消えました: $old_version"
              exit 1
            fi
          done

          expected_archive_url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ARCHIVE_NAME}"
          grep -Fq "<sparkle:version>$BUILD_VERSION</sparkle:version>" appcast.xml
          grep -Fq "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" appcast.xml
          grep -Fq "url=\"$expected_archive_url\"" appcast.xml
          grep -Fq "length=\"$ARCHIVE_SIZE\"" appcast.xml
          grep -Fq "sparkle:edSignature=\"" appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.target.outputs.release_tag }}
          name: Zashiki ${{ steps.target.outputs.release_tag }}
          files: |
            Zashiki-*-macos.zip
            appcast.xml
          generate_release_notes: false
          body_path: release-notes.md
          prerelease: false

      - name: Generate and attach release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_VERSION: ${{ steps.artifact.outputs.build_version }}
          MINIMUM_MACOS_VERSION: ${{ steps.artifact.outputs.minimum_macos_version }}
          ARCHIVE_NAME: ${{ steps.artifact.outputs.archive_name }}
          ARCHIVE_SIZE: ${{ steps.artifact.outputs.archive_size }}
          ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
        run: |
          set -euo pipefail

          published_at="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json publishedAt \
            --jq '.publishedAt')"
          appcast_sha256="$(shasum -a 256 appcast.xml | awk '{print $1}')"
          release_notes_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          archive_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ARCHIVE_NAME"

          jq -n \
            --argjson schema_version 1 \
            --arg version "$VERSION" \
            --arg build_version "$BUILD_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg published_at "$published_at" \
            --arg minimum_macos_version "$MINIMUM_MACOS_VERSION" \
            --arg release_notes_url "$release_notes_url" \
            --arg archive_name "$ARCHIVE_NAME" \
            --arg archive_url "$archive_url" \
            --argjson archive_size "$ARCHIVE_SIZE" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg appcast_sha256 "$appcast_sha256" \
            '{
              schema_version: $schema_version,
              version: $version,
              build_version: $build_version,
              tag: $tag,
              published_at: $published_at,
              minimum_macos_version: $minimum_macos_version,
              release_notes_url: $release_notes_url,
              archive: {
                name: $archive_name,
                url: $archive_url,
                size: $archive_size,
                sha256: $archive_sha256
              },
              appcast: {
                name: "appcast.xml",
                sha256: $appcast_sha256
              }
            }' > release-manifest.json

          gh release upload "$RELEASE_TAG" release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Validate release manifest
        env:
          ARCHIVE_NAME: ${{ steps.artifact.outputs.archive_name }}
          ARCHIVE_SIZE: ${{ steps.artifact.outputs.archive_size }}
          ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_VERSION: ${{ steps.artifact.outputs.build_version }}
          MINIMUM_MACOS_VERSION: ${{ steps.artifact.outputs.minimum_macos_version }}
        run: |
          set -euo pipefail

          appcast_sha256="$(shasum -a 256 appcast.xml | awk '{print $1}')"
          release_notes_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          archive_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ARCHIVE_NAME"

          jq -e \
            --arg version "$VERSION" \
            --arg build_version "$BUILD_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg minimum_macos_version "$MINIMUM_MACOS_VERSION" \
            --arg release_notes_url "$release_notes_url" \
            --arg archive_name "$ARCHIVE_NAME" \
            --arg archive_url "$archive_url" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg appcast_sha256 "$appcast_sha256" \
            --argjson archive_size "$ARCHIVE_SIZE" \
            '
              .schema_version == 1 and
              (.version | type) == "string" and .version == $version and
              (.build_version | type) == "string" and .build_version == $build_version and
              .tag == $tag and
              (.published_at | type) == "string" and
              .minimum_macos_version == $minimum_macos_version and
              .release_notes_url == $release_notes_url and
              .archive.name == $archive_name and
              .archive.url == $archive_url and
              .archive.size == $archive_size and
              .archive.sha256 == $archive_sha256 and
              .appcast.name == "appcast.xml" and
              .appcast.sha256 == $appcast_sha256
            ' release-manifest.json

      - name: Finalize stable CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PR_CREATE }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GH_PAT_PR_CREATE repository secret is required to update CHANGELOG.md."
            exit 1
          fi

          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          git checkout --detach origin/main

          if grep -Fq "## $RELEASE_TAG" CHANGELOG.md; then
            echo "CHANGELOGは既に確定済みです: $RELEASE_TAG"
            exit 0
          fi

          if ! grep -Fxq "## Unreleased" CHANGELOG.md; then
            echo "::error::No Unreleased section found in CHANGELOG.md"
            exit 1
          fi

          changelog_branch="release-changelog-${RELEASE_TAG}"
          if git ls-remote --exit-code origin "refs/heads/$changelog_branch" >/dev/null 2>&1; then
            git fetch --force origin "refs/heads/$changelog_branch:refs/remotes/origin/$changelog_branch"
            git checkout --detach "origin/$changelog_branch"
          else
            git switch -c "$changelog_branch"
          fi

          if grep -Fq "## $RELEASE_TAG" CHANGELOG.md; then
            echo "CHANGELOG PRのブランチですでに確定済みです: $RELEASE_TAG"
            exit 0
          fi

          release_date="$(date -u +%Y-%m-%d)"
          changelog_tmp="$(mktemp)"
          trap 'rm -f "$changelog_tmp"' EXIT
          awk -v release_tag="$RELEASE_TAG" -v release_date="$release_date" '
            !inserted && $0 == "## Unreleased" {
              print "## Unreleased"
              print ""
              print "## " release_tag " (" release_date ")"
              inserted = 1
              next
            }
            { print }
          ' CHANGELOG.md > "$changelog_tmp"
          mv "$changelog_tmp" CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: finalize ${RELEASE_TAG} changelog"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$changelog_branch"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$changelog_branch" \
            --state open \
            --json number \
            --jq '.[0].number')"
          if [[ -z "$pr_number" ]]; then
            pr_body="$(printf '%s\n\n- stableリリース後のCHANGELOGを%sとして確定\n- 次の開発用にUnreleased見出しを維持\n\n## Issue\n\n#190\n' '## Summary' "$RELEASE_TAG")"
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$changelog_branch" \
              --title "docs: finalize ${RELEASE_TAG} changelog" \
              --body "$pr_body")"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
          echo "CHANGELOG PR #$pr_number を作成または更新し、AutoMergeを有効化しました。"
