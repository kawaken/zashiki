name: Remove wip label on PR merge

on:
  pull_request:
    types: [closed]

jobs:
  remove-wip:
    # claude-code-action経由で作られたPR(ブランチ名が
    # `claude/issue-<番号>-<タイムスタンプ>`のパターン)に限定する。
    # 当初はPR本文の`#123`のような記述から関連Issueを抽出していたが、
    # Issue #124のような「複数のサブPRに渡って進行する親Issue」の場合、
    # 各サブPRの本文に`## Issue\n#124`と書いていただけで、そのつど
    # まだ完了していない親Issueのwipが外れてしまう事故が発生した。
    # ブランチ名に厳密に限定することで、人間が手動で作業する通常のPRの
    # Issue紐付けには一切影響しないようにする。
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/issue-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove wip label from the issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          issue=$(echo "$HEAD_REF" | sed -E 's#^claude/issue-([0-9]+)-.*#\1#')
          if ! [[ "$issue" =~ ^[0-9]+$ ]]; then
            echo "ブランチ名からIssue番号を抽出できませんでした: $HEAD_REF"
            exit 0
          fi
          labels=$(gh issue view "$issue" --repo "${{ github.repository }}" --json labels -q '.labels[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qx "wip"; then
            echo "Issue #$issue からwipラベルを外します"
            gh issue edit "$issue" --repo "${{ github.repository }}" --remove-label wip
          fi
